<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box">This is a div</div>
    <p class="para">this is a simple line</p>

    <script>
        // get attribute value
        let a = document.querySelector("div");
        console.log(a);
        let ans = a.getAttribute("id");
        console.log(ans);

        let cls = document.querySelector("p");
        console.log(cls);
        let clss = cls.getAttribute("class");
        console.log(clss);

        
    </script>
</body>
</html>
