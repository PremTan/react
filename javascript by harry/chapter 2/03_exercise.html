<body>
    <h1>Exercise 3</h1>
    <!-- Write a program to print "try again" until the user enters the correct number -->

    <script>
        let corr_num = 5;
        
        let i ;
        while (i != corr_num){
            i = prompt("Guess the correct number : ");
            if (i != corr_num){
                alert("try again");
            }
        }
        alert("Congrats, u guess correct number...");
    </script>
</body>
</html>
