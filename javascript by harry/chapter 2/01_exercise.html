<body>
    <h1>Exercise 1</h1>
    <!-- Write a program to print the marks of a student in an object using for loop -->

    <script>
        const marks = {
            harry : 70,
            rohan : 95,
            akash : 80,
            raj : 60
        }

        for (let i = 0; i < Object.keys(marks).length; i++){
            console.log("The marks of "+Object.keys(marks)[i]+ " are "+ marks[Object.keys(marks)[i]]);
        }
    </script>
</body>
